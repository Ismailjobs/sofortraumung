services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sofortraumung-web
    ports:
      - "3003:3000"
    environment:
      NODE_ENV: production
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
